{% extends 'base.html' %}{% block title %}Forgot Password{% endblock %}{% block content %}<div class="auth"><div class="card authcard"><h1>Create New Password</h1><p>Enter the registered username, name and Antolin organisation.</p>{% if error %}<div class="err">{{error}}</div>{% endif %}{% if success %}<div class="ok">{{success}}</div>{% endif %}<form method="post"><label>Username</label><input name="username" required><label>Name</label><input name="name" required><label>Organisation</label><input name="organisation" value="Antolin" required><label>New Password</label><input type="password" name="password" required><label>Confirm New Password</label><input type="password" name="confirm_password" required><button class="primary full">Change Password</button></form><div class="links"><a href="{{url_for('login')}}">Back to login</a></div></div></div>{% endblock %}
